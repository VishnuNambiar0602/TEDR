# Configuration file for Indian Road Object Detection Application
# Modify these settings without changing code

[MODEL]
# Model architecture: rtdetr-s, rtdetr-m, rtdetr-l, rtdetr-x
model_name = rtdetr-l

# Path to custom trained weights (leave empty for pre-trained)
# Example: custom_weights_path = runs/detect/train1/weights/best.pt
custom_weights_path = 

# Default confidence threshold (0.0 - 1.0)
default_confidence = 0.5

# Device: cuda (GPU) or cpu
device = cuda

[UI]
# Gradio interface settings
server_name = 0.0.0.0
server_port = 7860
share = False
show_error = True

# Title and description
title = 🚗 Indian Road Object Detection with RT-DETR
description = Detect vehicles, animals, and pedestrians in Indian road scenes

[INFERENCE]
# Maximum image size for inference (larger = more VRAM)
max_image_size = 1280

# Enable image caching for faster processing (requires more memory)
enable_cache = False

# Number of worker threads for image processing
num_workers = 4

[CLASSES]
# Class names and colors (RGB format)
# These can be customized for specific use cases

# Vehicles (R, G, B)
auto_rickshaw = 255,100,0
truck = 0,0,255
bus = 0,165,255
motorcycle = 200,0,200
car = 0,255,0
bicycle = 255,255,0
bull_cart = 165,42,42

# Animals
cow = 255,0,255
dog = 128,0,128
goat = 255,192,203

# Pedestrians
pedestrian = 255,0,0
jaywalker = 0,255,255

# Context
traffic_sign = 0,128,255
pole = 128,128,128

[TRAINING]
# Default training parameters (command-line can override these)
epochs = 100
batch_size = 16
image_size = 640
patience = 20

# Data augmentation settings
mosaic = 1.0
flipud = 0.5
fliplr = 0.5

# Learning rate
lr0 = 0.01
lrf = 0.01

[LOGGING]
# Enable detailed logging
verbose = True

# Save inference results
save_predictions = False
save_directory = results/
